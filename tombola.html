<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tómbola Hormiga</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐜</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #2a1d14; --ink: #fbf5ec; --muted: #c9b8a5; --accent: #f08a5d; --card: #3a2a1e; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center;
  }
  main { width: 100%; max-width: 760px; }
  h1 { font: 800 clamp(2rem, 7vw, 3.5rem)/1.1 Fraunces, Georgia, serif; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .stage {
    background: var(--card); border-radius: 24px; padding: 40px 16px; margin: 24px 0; min-height: 220px;
    display: flex; flex-direction: column; justify-content: center;
  }
  #display { font: 800 clamp(2rem, 8vw, 4.5rem)/1.1 Fraunces, Georgia, serif; word-break: break-word; }
  #sub { color: var(--muted); margin-top: 8px; min-height: 1.5em; }
  .winner #display { color: var(--accent); }
  button, input { font: 600 1.1rem Inter, sans-serif; border-radius: 14px; padding: 14px 20px; border: 0; }
  button { background: var(--accent); color: #2a1d14; cursor: pointer; }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  input { background: var(--card); color: var(--ink); border: 1px solid var(--muted); width: 100%; max-width: 320px; margin-bottom: 12px; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  #winners { list-style: none; padding: 0; margin: 24px 0 0; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Tómbola de la hormiga</h1>

  <form id="unlock">
    <p class="muted">Clave de la tómbola</p>
    <input id="key" type="password" autocomplete="off" required><br>
    <button>Cargar participantes</button>
    <p class="muted" id="status"></p>
  </form>

  <section id="raffle" hidden>
    <p class="muted" id="count"></p>
    <div class="stage" id="stage">
      <div id="display">¿Quién se lleva la hormiga?</div>
      <div id="sub"></div>
    </div>
    <div class="row">
      <button id="spin">Girar</button>
      <button id="reload" class="secondary">Actualizar lista</button>
    </div>
    <ul id="winners"></ul>
  </section>
</main>

<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let participants = [];
const winners = new Set();

const maskEmail = (email) => {
  const [user, domain] = String(email).split("@");
  return `${user.slice(0, 2)}${"•".repeat(Math.max(user.length - 2, 1))}@${domain}`;
};

const randomIndex = (n) => crypto.getRandomValues(new Uint32Array(1))[0] % n;

async function loadParticipants() {
  const url = `${window.SCRIPT_URL}?key=${encodeURIComponent($("key").value)}`;
  const data = await (await fetch(url)).json();
  if (!data.ok) throw new Error(data.error || "Error");
  participants = data.participants;
  const eligible = participants.filter((p) => !winners.has(p.email)).length;
  $("count").textContent = `${participants.length} participantes · ${eligible} pueden ganar`;
}

$("unlock").onsubmit = async (event) => {
  event.preventDefault();
  $("status").textContent = "Cargando…";
  try {
    await loadParticipants();
    $("unlock").hidden = true;
    $("raffle").hidden = false;
  } catch (error) {
    $("status").textContent = `No se pudo cargar: ${error.message}`;
  }
};

$("reload").onclick = () => loadParticipants().catch((e) => alert(e.message));

$("spin").onclick = () => {
  const pool = participants.filter((p) => !winners.has(p.email));
  if (!pool.length) return ($("display").textContent = "No hay participantes");

  const winner = pool[randomIndex(pool.length)];
  $("spin").disabled = true;
  $("stage").classList.remove("winner");
  $("sub").textContent = "";

  let delay = 40;
  const tick = () => {
    $("display").textContent = pool[randomIndex(pool.length)].name;
    delay *= 1.08;
    if (delay < 450) return setTimeout(tick, delay);
    winners.add(winner.email);
    $("display").textContent = winner.name;
    $("sub").textContent = `${maskEmail(winner.email)} · Antena ${winner.antenna}`;
    $("stage").classList.add("winner");
    $("winners").prepend(Object.assign(document.createElement("li"), { textContent: `${winner.name} — ${maskEmail(winner.email)}` }));
    $("count").textContent = `${participants.length} participantes · ${pool.length - 1} pueden ganar`;
    $("spin").disabled = false;
  };
  tick();
};
</script>
</body>
</html>
